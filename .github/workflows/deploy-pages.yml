name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build invitation
        env:
          INVITATION_CONFIG: ${{ secrets.INVITATION_CONFIG }}
        run: |
          test -n "$INVITATION_CONFIG"
          printf '%s\n' "$INVITATION_CONFIG" > static/invitation.conf
          ./static/build.sh

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: static/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
